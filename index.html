<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JamieJets MVS • 3270</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <style>
    :root {color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:#0a1018;color:#d8e9ed;min-height:100vh}
    header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #263849;background:#0e1925}
    .brand{font-weight:700;letter-spacing:.12em}.brand span{color:#6ad5bd}small{color:#91a6b8}
    main{display:grid;place-items:center;min-height:calc(100vh - 44px);padding:8px 12px}
    .card{width:min(100%,390px);padding:32px;border:1px solid #294154;border-radius:14px;background:#122232;box-shadow:0 22px 70px #0006}
    .login-version{display:block;text-align:right;font-size:10px;color:#555;opacity:.8}
    body:has(#loginView:not([hidden])){background:#3b71a7;color:#000;font-family:Tahoma,'MS Sans Serif',Arial,sans-serif;color-scheme:light}
    body:has(#loginView:not([hidden])) header{display:none}
    body:has(#loginView:not([hidden])) main{min-height:100dvh}
    body:has(#terminalView:not([hidden])) header{display:none}
    body:has(#terminalView:not([hidden])) main{min-height:100dvh;padding:6px 12px}
    body:has(#terminalView:not([hidden])) #terminalView:not(:fullscreen):not(.pseudo-fullscreen){height:calc(100dvh - 12px)}
    #loginView.win2000{width:min(415px,calc(100vw - 24px));padding:0;border:2px solid;border-color:#fff #333 #333 #fff;border-radius:0;background:#d4d0c8;box-shadow:1px 1px 0 #777;font-size:11px;color:#000}
    .win-title{height:19px;display:flex;align-items:center;padding:0 4px;background:linear-gradient(90deg,#0a246a,#5e9ad5);color:#fff;font-size:11px;font-weight:700}
    .win-banner{height:92px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#fff 0%,#fff 84%,#dbe3e4 85%,#247aa7 100%);border-bottom:1px solid #757575}
    .win-logo{display:grid;grid-template-columns:repeat(2,17px);grid-template-rows:repeat(2,17px);gap:2px;transform:skew(-8deg) rotate(-7deg);filter:drop-shadow(4px 4px 0 #ee7900)}
    .win-logo i:nth-child(1){background:#ec3425}.win-logo i:nth-child(2){background:#58a431}.win-logo i:nth-child(3){background:#2876bf}.win-logo i:nth-child(4){background:#f6c330}
    .win-wordmark{font-family:Arial,sans-serif;line-height:.93;letter-spacing:-1.5px}.win-wordmark .win-word{font-size:30px;font-weight:900}.win-wordmark .win-year{font-size:24px;font-weight:400}.win-wordmark .win-edition{font-size:18px;font-weight:900;letter-spacing:-.8px}.win-wordmark .win-subtitle{font-size:11px;letter-spacing:0;text-align:center;margin-top:3px}
    .win-body{padding:16px 11px 10px}.win-row{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:6px;margin:4px 0 8px}.win-row label{margin:0;font-size:11px}.win-row input{height:22px;border:2px solid;border-color:#808080 #fff #fff #808080;border-radius:0;background:#fff;color:#000;padding:1px 5px;font:12px Tahoma,Arial,sans-serif;outline:none}.win-row input:focus{outline:1px dotted #222;outline-offset:-4px}
    .win-check{display:flex;align-items:center;gap:6px;margin:0 0 0 78px;font:11px Tahoma,Arial,sans-serif;cursor:pointer}.win-check input{appearance:auto;width:13px;height:13px;margin:0;padding:0;border:0;border-radius:0;accent-color:#0a246a}.win-check span{line-height:16px}
    .win-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:15px}.win-actions button{min-width:73px;height:24px;padding:2px 8px;border:2px solid;border-color:#fff #555 #555 #fff;border-radius:0;background:#d4d0c8;color:#000;font:11px Tahoma,Arial,sans-serif;box-shadow:1px 1px 0 #222}.win-actions button:active{border-color:#555 #fff #fff #555;box-shadow:none}.win-actions button:disabled{color:#777;text-shadow:1px 1px #fff;cursor:default}.win-actions button:focus-visible{outline:1px dotted #000;outline-offset:-5px}
    #loginView #error{color:#a00000;min-height:0;margin:2px 0 0 78px;font-size:11px;line-height:1.2}#loginView #error:empty{display:none}
    h1{font-size:24px;margin:0 0 8px}p{color:#91a6b8;line-height:1.5}label{display:block;font-size:13px;margin:28px 0 9px}
    input{width:100%;background:#091521;border:1px solid #39576c;border-radius:7px;color:white;padding:13px;font:inherit}
    input:focus{outline:2px solid #6ad5bd}button{border:0;border-radius:7px;background:#6ad5bd;color:#071a1c;font-weight:700;padding:12px 19px;cursor:pointer}
    button:hover{background:#9df0db}button.secondary{background:#243d4e;color:#e2edef}#error{color:#ff9e9e;min-height:1.5em}
    #terminalView{width:100%;height:calc(100dvh - 60px);align-self:stretch;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);column-gap:12px;row-gap:6px}#screen{grid-column:1/-1;grid-row:2;display:flex;align-items:center;justify-content:center;background:#252b2d;border:1px solid #345061;border-radius:9px;padding:14px;overflow:hidden;box-shadow:0 20px 70px #0008;min-height:0}
    .toolbar{grid-column:2;grid-row:1;display:flex;justify-content:flex-end;align-items:center;height:42px;gap:8px}.toolbar-actions{display:flex;gap:6px;align-items:center;height:42px}.toolbar button{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 13px}.toolbar .icon-button{min-width:39px;min-height:0;padding:0 6px;font-size:23px;line-height:1}.icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.zoom-controls{display:flex;align-items:center;gap:0;height:42px;border-radius:7px;background:#243d4e;white-space:nowrap}.toolbar .zoom-controls button{min-width:32px;padding:0 8px;border-radius:7px;background:transparent;color:#e2edef;font-size:19px;line-height:1}.zoom-controls output{min-width:45px;text-align:center;font-size:12px;font-weight:700}.dot{display:inline-block;flex:none;background:#eeae59;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 3px #ffffff14;margin:0 5px 0 8px}
    .pf-bar{grid-column:1;grid-row:1;align-self:center;display:flex;align-items:center;height:42px;gap:6px;position:relative;padding:0;justify-content:flex-start;min-width:0}.pf-bar button{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;height:42px;min-width:50px;padding:0 12px;background:#243d4e;color:#e2edef}.pf-bar button.pf-special{min-width:68px;font-weight:800}.pf-bar button:active{background:#6ad5bd;color:#071a1c}.pf-bar .pf-more{font-size:20px;min-width:44px;padding:0 12px}.pf-popover{position:absolute;z-index:50;top:calc(100% + 6px);left:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:min(340px,calc(100vw - 32px));padding:12px;background:#122232;border:1px solid #39576c;border-radius:10px;box-shadow:0 15px 45px #000b}.pf-popover button{min-width:0;padding:12px 5px}
    .xterm{flex:none;transform-origin:center center}.xterm .xterm-viewport{scrollbar-width:none!important}.xterm .xterm-viewport::-webkit-scrollbar{display:none} [hidden]{display:none!important}
    #terminalView:fullscreen{grid-template-rows:minmax(0,1fr) auto;background:#0a1018;padding:8px 12px 3px;width:100%;height:100%;overflow:hidden}
    #terminalView:fullscreen #screen{grid-row:1;height:auto;min-height:0}
    #terminalView:fullscreen > p{display:none}
    #terminalView.pseudo-fullscreen{position:fixed;inset:0;z-index:1000;grid-template-rows:minmax(0,1fr) auto;background:#0a1018;padding:8px 12px 0;width:100%;height:100dvh;overflow:hidden}
    #terminalView.pseudo-fullscreen #screen{grid-row:1;height:auto;min-height:0}
    #terminalView:fullscreen .pf-bar,#terminalView.pseudo-fullscreen .pf-bar{grid-column:1;grid-row:2;align-self:stretch;height:50px;padding:2px 0 6px 18px}
    #terminalView:fullscreen .pf-popover,#terminalView.pseudo-fullscreen .pf-popover{top:auto;bottom:calc(100% + 6px)}
    #terminalView:fullscreen .toolbar,#terminalView.pseudo-fullscreen .toolbar{grid-column:2;grid-row:2;align-self:stretch;height:50px;margin:0;padding:2px 18px 6px 0}
    #terminalView.pseudo-fullscreen > p{display:none}
    @media(max-width:700px){header{padding:0 16px}main{padding:8px}.card{padding:24px}#screen{padding:8px}.pf-bar{justify-content:flex-start}#loginView.win2000{padding:0}.win-wordmark .win-word{font-size:27px}.win-wordmark .win-year{font-size:21px}}
  </style>
</head>
<body>
<header><div class="brand">JAMIE<span>JETS</span> / MVS</div><small>IBM 3270 TERMINAL</small></header>
<main>
  <section id="loginView" class="win2000" hidden>
    <div class="win-title">Log On to MVS</div>
    <div class="win-banner"><span class="win-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div class="win-wordmark"><div><span class="win-word">Windows</span> <span class="win-year">2000</span></div><div class="win-edition">Professional</div><div class="win-subtitle">Built on NT Technology</div></div></div>
    <div class="win-body"><form id="loginForm">
      <div class="win-row"><label for="username">User name:</label><input id="username" name="username" autocomplete="username" value="Admin" required></div>
      <div class="win-row"><label for="password">Password:</label><input id="password" type="password" autocomplete="current-password" required autofocus></div>
      <label class="win-check" for="loginFullscreen"><input id="loginFullscreen" type="checkbox"><span>Log on full screen mode</span></label>
      <p id="error" role="alert"></p>
      <div class="win-actions"><button type="submit">OK</button><button type="reset">Cancel</button><button type="button" disabled>Shut Down...</button></div>
    </form><small class="login-version">v1.13</small></div>
  </section>
  <section id="terminalView" hidden>
    <div class="toolbar"><div class="toolbar-actions"><div class="zoom-controls" role="group" aria-label="Terminal zoom"><button id="zoomOut" type="button" aria-label="Zoom out 10 percent" title="Zoom out">−</button><output id="zoomValue" aria-live="polite">100%</output><button id="zoomIn" type="button" aria-label="Zoom in 10 percent" title="Zoom in">+</button></div><button class="secondary icon-button" id="fullscreen" type="button" aria-label="Fullscreen" title="Fullscreen">⛶</button><button class="secondary" id="disconnect" title="End MVS session">Disconnect</button><button class="secondary icon-button" id="logout" type="button" aria-label="Log out" title="Log out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div><span class="dot" id="dot" role="status" aria-label="Connecting" title="Connecting"></span></div>
    <div class="pf-bar" id="pfBar" role="group" aria-label="3270 function keys"><div class="pf-popover" id="pfPopover" role="group" aria-label="All 3270 PF keys" hidden></div></div>
    <div id="screen"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script>
  'use strict';
  const $ = id => document.getElementById(id);
  const base = location.pathname.replace(/\/?$/, '/');
  let socket, term, screenObserver;
  let backgroundAt=0, reconnectTimer=null, manuallyDisconnected=false;
  let socketConnectingSince=0, lastWatchdogTick=Date.now();
  let resizeTerminal=()=>{};
  const isIPad=/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  let zoom = 100;
  const functionKeys={
    '1':'\x1bOP','2':'\x1bOQ','3':'\x1bOR','4':'\x1bOS',
    '5':'\x1b[15~','6':'\x1b[17~','7':'\x1b[18~','8':'\x1b[19~',
    '9':'\x1b[20~','0':'\x1b[21~','-':'\x1b[23~','=':'\x1b[24~'
  };
  function sendTerminalInput(data){
    if(!socket || socket.readyState!==WebSocket.OPEN)return;
    const bytes=new TextEncoder().encode(data);
    let s='';for(const b of bytes)s+=String.fromCharCode(b);
    socket.send(btoa(s));
  }
  function sendPF(n){
    const low=(n-1)%12+1;
    const key=low===10?'0':low===11?'-':low===12?'=':String(low);
    // c3270's default keymap uses Ctrl+A followed by F1–F12 for PF13–PF24.
    sendTerminalInput((n>12?'\x01':'')+functionKeys[key]);
    if(term)term.focus();
  }
  function pfButton(n){
    const button=document.createElement('button');
    button.type='button';
    button.textContent='PF'+n;
    if([3,7,8].includes(n))button.classList.add('pf-special');
    button.setAttribute('aria-label','Program Function '+n);
    button.addEventListener('click',()=>{
      $('pfPopover').hidden=true;
      $('pfMore').setAttribute('aria-expanded','false');
      sendPF(n);
    });
    return button;
  }
  for(const n of [3,7,8])$('pfBar').insertBefore(pfButton(n),$('pfPopover'));
  const more=document.createElement('button');
  more.type='button';more.id='pfMore';more.textContent='+';more.className='pf-more';
  more.setAttribute('aria-label','Show all 24 PF keys');
  more.setAttribute('aria-expanded','false');
  more.setAttribute('aria-controls','pfPopover');
  more.addEventListener('click',()=>{
    const show=$('pfPopover').hidden;
    $('pfPopover').hidden=!show;
    more.setAttribute('aria-expanded',String(show));
  });
  $('pfBar').insertBefore(more,$('pfPopover'));
  for(let n=1;n<=24;n++)$('pfPopover').appendChild(pfButton(n));
  document.addEventListener('pointerdown',event=>{
    if(!$('pfBar').contains(event.target)){
      $('pfPopover').hidden=true;
      more.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('keydown',event=>{
    if(!term || $('terminalView').hidden || event.altKey || event.shiftKey)return;
    // Intercept before xterm/c3270, where Ctrl+3 would otherwise mean Escape.
    if(!((event.ctrlKey && !event.metaKey) || (isIPad && event.metaKey && !event.ctrlKey)))return;
    const key=event.key;
    if(!Object.prototype.hasOwnProperty.call(functionKeys,key))return;
    event.preventDefault();
    event.stopPropagation();
    if(!event.repeat){
      const n=key==='0'?10:key==='-'?11:key==='='?12:Number(key);
      sendPF(n);
    }
  },true);
  function syncFullscreen(){
    const full=!!document.fullscreenElement || $('terminalView').classList.contains('pseudo-fullscreen');
    $('fullscreen').textContent=full?'⤡':'⛶';
    $('fullscreen').setAttribute('aria-label',full?'Exit fullscreen':'Fullscreen');
    $('fullscreen').title=full?'Exit fullscreen':'Fullscreen';
    updateVisualViewport();
    requestAnimationFrame(()=>{resizeTerminal();if(term)term.focus();});
  }
  function updateVisualViewport(){
    resizeTerminal();
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',updateVisualViewport);
    window.visualViewport.addEventListener('scroll',updateVisualViewport);
  }
  window.addEventListener('orientationchange',updateVisualViewport);
  updateVisualViewport();
  async function exitTerminalFullscreen(){
    $('terminalView').classList.remove('pseudo-fullscreen');
    if(document.fullscreenElement)await document.exitFullscreen();
    syncFullscreen();
  }
  const loginView=$('loginView');
  const passwordField=$('password');
  function showLogin(){
    $('terminalView').hidden=true;
    // The same form node retains its submit handler after being reattached.
    $('terminalView').before(loginView);
    loginView.hidden=false;
    passwordField.focus();
  }
  function showTerminal(){
    // Remove the password field from the DOM entirely while authenticated.
    // Merely hiding it can leave some password-manager overlays on screen.
    passwordField.blur();
    passwordField.value='';
    loginView.hidden=true;
    loginView.remove();
    $('terminalView').hidden=false;
    if(sessionStorage.getItem('web3270-login-fullscreen')==='1'){
      sessionStorage.removeItem('web3270-login-fullscreen');
      // Browser fullscreen needs a direct user gesture; the fixed layout also
      // works after the login reload and keeps the iPad keyboard usable.
      $('terminalView').classList.add('pseudo-fullscreen');
      syncFullscreen();
    }
    manuallyDisconnected=false;
    connect();
  }
  async function check(){try{const r=await fetch(base+'status',{cache:'no-store'});const j=await r.json();j.authenticated?showTerminal():showLogin();}catch{showLogin();$('error').textContent='Server unavailable.';}}
  $('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();$('error').textContent='';
    const wantsFullscreen=$('loginFullscreen').checked;
    // Request native browser fullscreen synchronously with the OK key/click:
    // browsers reject requests made after an asynchronous login or reload.
    const fullscreenRequest=wantsFullscreen && !isIPad && document.documentElement.requestFullscreen
      ?document.documentElement.requestFullscreen().then(()=>true,()=>false)
      :Promise.resolve(false);
    try{const r=await fetch(base+'login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});
      if(!r.ok)throw Error('Incorrect password or login unavailable');
      if(wantsFullscreen){
        await fullscreenRequest;
        sessionStorage.removeItem('web3270-login-fullscreen');
        showTerminal();
        $('terminalView').classList.add('pseudo-fullscreen');
        syncFullscreen();
        return;
      }
      sessionStorage.removeItem('web3270-login-fullscreen');
      // A full navigation also clears password-manager UI injected by extensions.
      // The authentication cookie survives; check() opens the terminal on reload.
      passwordField.blur();
      passwordField.value='';
      window.location.reload();
    }catch(err){
      if(await fullscreenRequest && document.fullscreenElement)await document.exitFullscreen();
      $('error').textContent=err.message;
    }
  });
  $('logout').addEventListener('click',async()=>{manuallyDisconnected=true;if(reconnectTimer)clearTimeout(reconnectTimer);await exitTerminalFullscreen();if(socket)socket.close();if(screenObserver){screenObserver.disconnect();screenObserver=null;}if(term){term.dispose();term=null;}$('screen').replaceChildren();await fetch(base+'logout',{method:'POST'});showLogin();});
  $('disconnect').addEventListener('click',async()=>{
    if(!confirm('Disconnect the MVS session? Unsaved work in MVS may be lost.'))return;
    const result=await fetch(base+'disconnect',{method:'POST'});
    if(!result.ok){alert('Could not disconnect MVS.');return;}
    manuallyDisconnected=true;
    if(reconnectTimer)clearTimeout(reconnectTimer);
    if(socket)socket.close();
    if(term)term.write('\r\n\r\nMVS disconnected. Reload this page to start a new session.\r\n');
  });
  $('fullscreen').addEventListener('click',async()=>{
    try{
      if(document.fullscreenElement || $('terminalView').classList.contains('pseudo-fullscreen')){
        await exitTerminalFullscreen();
      }else if(isIPad){
        // iPad Safari can exit native fullscreen when its keyboard takes focus.
        // A fixed viewport overlay keeps xterm's textarea usable.
        $('terminalView').classList.add('pseudo-fullscreen');
        syncFullscreen();
      }else{
        await $('terminalView').requestFullscreen();
        syncFullscreen();
      }
    }catch(error){console.warn('Fullscreen unavailable:',error);}
  });
  document.addEventListener('fullscreenchange',syncFullscreen);
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape' && $('terminalView').classList.contains('pseudo-fullscreen')){
      exitTerminalFullscreen();
    }
  });
  $('screen').addEventListener('touchend',()=>{if(term)term.focus();},{passive:true});
  function changeZoom(delta){
    zoom=Math.max(50,Math.min(150,zoom+delta));
    $('zoomValue').textContent=zoom+'%';
    $('zoomOut').disabled=zoom===50;
    $('zoomIn').disabled=zoom===150;
    applyStretch();
    if(term)term.focus();
  }
  $('zoomOut').addEventListener('click',()=>changeZoom(-10));
  $('zoomIn').addEventListener('click',()=>changeZoom(10));
  function scheduleReconnect(){
    if(reconnectTimer || manuallyDisconnected || $('terminalView').hidden || document.visibilityState==='hidden')return;
    reconnectTimer=setTimeout(()=>{
      reconnectTimer=null;
      if(!manuallyDisconnected && socket && socket.readyState===WebSocket.CLOSED)connect();
    },1500);
  }
  function resumeTerminal(forceReconnect=false){
    if(manuallyDisconnected || $('terminalView').hidden)return;
    const wasAway=backgroundAt>0 && Date.now()-backgroundAt>1000;
    backgroundAt=0;
    if(socket && socket.readyState===WebSocket.CONNECTING && !forceReconnect && Date.now()-socketConnectingSince<12000)return;
    if(!socket || socket.readyState!==WebSocket.OPEN || wasAway || forceReconnect){
      if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null;}
      connect();
    }else if(term){term.focus();}
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)backgroundAt=Date.now();
    else resumeTerminal();
  });
  window.addEventListener('blur',()=>{if(!backgroundAt)backgroundAt=Date.now();});
  window.addEventListener('focus',()=>resumeTerminal());
  window.addEventListener('online',()=>resumeTerminal());
  window.addEventListener('pageshow',()=>resumeTerminal());
  // Sleeping machines can wake without firing focus/online/visibilitychange.
  // A large wall-clock gap means this timer was suspended during sleep.
  setInterval(()=>{
    const now=Date.now();
    const slept=now-lastWatchdogTick>12000;
    lastWatchdogTick=now;
    if(manuallyDisconnected || $('terminalView').hidden || document.hidden)return;
    if(slept || !socket || socket.readyState===WebSocket.CLOSED ||
       (socket.readyState===WebSocket.CONNECTING && now-socketConnectingSince>12000)){
      resumeTerminal(slept);
    }
  },5000);
  function applyStretch(){
    if(!term || !term.element)return;
    const surface=term.element;
    surface.style.transform='none';
    const area=$('screen');
    const width=surface.offsetWidth;
    const height=surface.offsetHeight;
    if(width>0 && height>0){
      // Leave just 6px on each side when zoom is at 100%.
      const sx=Math.max(1,(area.clientWidth-12)/width);
      const sy=Math.max(1,(area.clientHeight-12)/height);
      surface.style.transform=`scale(${sx*zoom/100}, ${sy*zoom/100})`;
    }
  }
  function connect(){
    if(manuallyDisconnected || $('terminalView').hidden)return;
    if(socket && socket.readyState!==WebSocket.CLOSED)socket.close();
    if(screenObserver){screenObserver.disconnect();screenObserver=null;}
    if(term){term.dispose();$('screen').replaceChildren();}
    term=new Terminal({cols:80,rows:24,fontFamily:'monospace',fontSize:16,theme:{background:'#252b2d',foreground:'#a9ead2',cursor:'#73e8c5'},cursorBlink:true,scrollback:0});
    term.open($('screen'));term.focus();
    term.attachCustomKeyEventHandler(event=>{
      const shortcut=event.ctrlKey||event.metaKey;
      const key=event.key.toLowerCase();
      if(!shortcut || !['v','c'].includes(key))return true;
      const paste=key==='v';
      if(!paste && !event.shiftKey)return true; // Ctrl+C stays a terminal key.
      if(event.type==='keydown'){
        event.preventDefault();
        if(paste){
          navigator.clipboard.readText().then(text=>{if(text && term)term.paste(text);})
            .catch(error=>console.warn('Clipboard paste unavailable:',error));
        }else{
          const selection=term.getSelection();
          if(selection)navigator.clipboard.writeText(selection)
            .catch(error=>console.warn('Clipboard copy unavailable:',error));
        }
      }
      return false;
    });
    function fitTerminal(){
      if(!term)return;
      const screen=$('screen');
      const availableWidth=screen.clientWidth-36;
      const availableHeight=screen.clientHeight-36;
      // Keep fixed TN3270 model 2 dimensions (80x24); scale font, not rows/cols.
      const font=Math.max(11,Math.min(30,Math.floor(Math.min(availableWidth/(80*0.62),availableHeight/(24*1.25)))));
      term.options.fontSize=font;
      requestAnimationFrame(applyStretch);
    }
    resizeTerminal=fitTerminal;
    fitTerminal();
    screenObserver=new ResizeObserver(fitTerminal);
    screenObserver.observe($('screen'));
    const proto=location.protocol==='https:'?'wss:':'ws:';
    socket=new WebSocket(proto+'//'+location.host+base+'ws');
    socketConnectingSince=Date.now();
    const currentSocket=socket;
    socket.onopen=()=>{ if(socket!==currentSocket)return;socketConnectingSince=0;$('dot').style.background='#6ad5bd';$('dot').setAttribute('aria-label','Connected');$('dot').title='Connected'; };
    socket.onclose=event=>{ if(socket!==currentSocket)return;$('dot').style.background='#f38b86';$('dot').setAttribute('aria-label','Disconnected');$('dot').title='Disconnected';if(event.code===4001){manuallyDisconnected=true;$('dot').title='Session opened on another device';}else scheduleReconnect(); };
    socket.onerror=()=>{ if(socket!==currentSocket)return;$('dot').style.background='#f38b86';$('dot').setAttribute('aria-label','Connection error');$('dot').title='Connection error'; };
    socket.onmessage=e=>{if(socket!==currentSocket || !term)return;const binary=atob(e.data);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));term.write(bytes);};
    term.onData(sendTerminalInput);
  }
  check();
</script>
</body>
</html>
